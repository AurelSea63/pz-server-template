services:
  pz-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pz-server
    hostname: pz-server

    # Resources — tune to your VPS (-Xmx must stay < mem_limit)
    mem_limit: 8g
    memswap_limit: 8g
    cpus: '4.0'

    # Ports
    ports:
      - "16210:16210/tcp"
      - "16210:16210/udp"
      # RCON / admin (restrict the source in your firewall)
      - "16211:16211/tcp"
      - "16211:16211/udp"
      # Steam ports (Steam Internet server list)
      - "8766:8766/udp"
      - "8767:8767/udp"
      # PZ secondary direct-connection port (removes the perf warning)
      - "16262:16262/udp"

    volumes:
      # Persistent data (world, accounts)
      - pz_data:/opt/pz-server/Zomboid
      # Configuration (versioned ini + sandbox)
      - ./config:/opt/pz-server/config:ro
      # Optional local mods (Workshop mods download themselves)
      - ./mods:/opt/pz-server/mods:ro

    environment:
      # Server id -> name of the ini file read (Zomboid/Server/<id>.ini)
      PZ_SERVER_NAME_ID: "servertest"
      # Secrets injected from .env (see .env.example). Do NOT put secrets here.
      PZ_ADMIN_PASSWORD: "${PZ_ADMIN_PASSWORD:-changeme}"
      PZ_SERVER_PASSWORD: "${PZ_SERVER_PASSWORD:-}"
      PZ_RCON_PASSWORD: "${PZ_RCON_PASSWORD:-changeme}"
      # -Xmx must stay < mem_limit (headroom for off-heap JVM)
      JAVA_OPTS: "-Xmx6g -Xms2g -XX:+UseG1GC -XX:MaxGCPauseMillis=50"
      TZ: "Europe/Paris"

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

    stop_signal: SIGTERM
    stop_grace_period: 30s

    networks:
      - pz-network

volumes:
  pz_data:
    driver: local

networks:
  pz-network:
    driver: bridge
