# Project Zomboid server configuration (Build 42)
# Official doc: https://pzwiki.net/wiki/Server_settings
# Passwords (Password / RCONPassword) are left EMPTY here: they are injected at
# startup from .env (PZ_SERVER_PASSWORD / PZ_RCON_PASSWORD).

# ============================================
# SERVER INFO
# ============================================
ServerName=My Zomboid Server
# Public=true : shown in the Steam Internet list (requires ports 8766-8767 open).
Public=false
PublicName=My Zomboid Server
PublicDescription=Project Zomboid Build 42 server
MaxPlayers=16
# Open=true : account created automatically on first login.
Open=true
# Entry password -> injected from .env (PZ_SERVER_PASSWORD). Empty = public.
Password=

# ============================================
# NETWORK (official PZ keys)
# ============================================
# DefaultPort = UDP game port (do NOT use 'Port=', ignored by PZ).
DefaultPort=16210
# Steam ports (server list / NAT).
SteamPort1=8766
SteamPort2=8767
# RCON (remote console) -> password injected from .env (PZ_RCON_PASSWORD).
RCONPort=16211
RCONPassword=

# ============================================
# GAMEPLAY
# ============================================
PVP=false
SafetySystem=true
ShowSafety=true
PauseEmpty=true
GlobalChat=true
Map=Muldraugh, KY

# ============================================
# SAFEHOUSE (let players claim a residence)
# ============================================
# PlayerSafehouse=true lets players (not just admins) claim safehouses.
PlayerSafehouse=true
AdminSafehouse=false
SafehouseAllowTrepass=true
SafehouseAllowFire=true
SafehouseAllowLoot=true
SafehouseAllowRespawn=true
# Days survived before a player can claim (0 = immediately)
SafehouseDaySurvivedToClaim=0
# Safehouse removed after X hours of the owner being offline (144 = 6 days)
SafeHouseRemovalTime=144
# false = residential buildings only ; true = any building
SafehouseAllowNonResidential=false

# ============================================
# MODS
# ============================================
# Mods=          : internal mod IDs (order = load order: libs -> vehicles -> QoL)
# WorkshopItems= : Workshop IDs (the server downloads them on startup)
# Example:
#   WorkshopItems=2392709985;2857548524
#   Mods=tsarslib;ExampleMod
# DeathLog = death-notifications mod (Workshop). Remove both lines if you don't use Discord.
Mods=DeathLog
WorkshopItems=3783916125

# ============================================
# MISC
# ============================================
ResetID=572058526
# Shown to each player on connect. <LINE> = new line, <RGB:r,g,b> = color (0-1). Keep it on ONE line.
# Example: <RGB:0.4,1,0.4>Welcome!<LINE><RGB:1,1,1>PVE - x2 XP - QoL mods - claim your safehouse!
ServerWelcomeMessage=Welcome to the server!
