# Configuration serveur Project Zomboid (Build 42)
# Doc officielle : https://pzwiki.net/wiki/Server_settings
# Les mots de passe (Password / RCONPassword) sont laissés VIDES ici : ils sont
# injectés au démarrage depuis .env (PZ_SERVER_PASSWORD / PZ_RCON_PASSWORD).

# ============================================
# INFOS SERVEUR
# ============================================
ServerName=My Zomboid Server
# Public=true : visible dans la liste Steam Internet (nécessite ports 8766-8767 ouverts).
Public=false
PublicName=My Zomboid Server
PublicDescription=Serveur Project Zomboid Build 42
MaxPlayers=16
# Open=true : compte créé automatiquement au 1er login.
Open=true
# Mot de passe d'entrée -> injecté depuis .env (PZ_SERVER_PASSWORD). Vide = public.
Password=

# ============================================
# RÉSEAU (clés PZ officielles)
# ============================================
# DefaultPort = port de jeu UDP (NE PAS utiliser 'Port=', ignoré par PZ).
DefaultPort=16210
# Ports Steam (liste de serveurs / NAT).
SteamPort1=8766
SteamPort2=8767
# RCON (console distante) -> mot de passe injecté depuis .env (PZ_RCON_PASSWORD).
RCONPort=16211
RCONPassword=

# ============================================
# GAMEPLAY
# ============================================
PVP=false
PauseEmpty=true
GlobalChat=true
Map=Muldraugh, KY

# ============================================
# MODS
# ============================================
# Mods=          : IDs internes des mods (ordre = ordre de chargement : libs -> voitures -> QoL)
# WorkshopItems= : IDs Workshop (le serveur les télécharge tout seul au démarrage)
# Exemple :
#   WorkshopItems=2392709985;2857548524
#   Mods=tsarslib;ExampleMod
Mods=
WorkshopItems=

# ============================================
# DIVERS
# ============================================
ResetID=572058526
ServerWelcomeMessage=Bienvenue sur le serveur !
