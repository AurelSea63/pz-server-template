# Discord integration settings (NON secret).
# Webhook URLs go in .env (DISCORD_WEBHOOK_URL, DISCORD_CONNECT_WEBHOOK,
# DISCORD_ANNOUNCE_WEBHOOK, DISCORD_EVENT_WEBHOOK, DISCORD_DEATH_WEBHOOK) so they
# are never committed.

# Bot identity
DISCORD_BOT_NAME="PZ Server"

# Event types to log (1=on, 0=off)
LOG_SERVER_START=1
LOG_SERVER_STOP=1
LOG_PLAYER_CONNECT=1
LOG_PLAYER_DISCONNECT=1
LOG_PLAYER_DEATH=1
LOG_ADMIN_ACTIONS=1
LOG_RAIDS=1
LOG_BACKUPS=1
