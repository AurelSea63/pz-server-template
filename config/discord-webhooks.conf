# Réglages de l'intégration Discord (NON secrets).
# Les URLs des webhooks se mettent dans .env (DISCORD_WEBHOOK_URL, DISCORD_ANNOUNCE_WEBHOOK,
# DISCORD_EVENT_WEBHOOK) pour ne jamais les commiter.

# Identité du bot
DISCORD_BOT_NAME="PZ Server"

# Types d'événements à logger (1=actif, 0=inactif)
LOG_SERVER_START=1
LOG_SERVER_STOP=1
LOG_PLAYER_CONNECT=1
LOG_PLAYER_DISCONNECT=1
LOG_PLAYER_DEATH=1
LOG_ADMIN_ACTIONS=1
LOG_RAIDS=1
LOG_BACKUPS=1
